<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Secure CYVANTA portal login." />
    <meta name="theme-color" content="#050810" />
    <title>Secure Login | CYVANTA</title>
    <link rel="icon" href="assets/icons/favicon.svg" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css" />
  </head>
  <body>
    <header class="auth-topbar">
      <a class="logo" href="index.html" aria-label="Stackly home"
        ><img
          class="brand-logo-image"
          src="assets/images/stackly-logo-transparent.webp"
          alt="Stackly" /></a
      ><a class="back-home" href="index.html">← Back to Home</a>
    </header>
    <main class="auth-page auth-split">
      <section class="auth-visual reveal">
        <img
          src="assets/images/cyber/secure-login.webp"
          alt="Secure digital identity and login protection"
          loading="eager"
        />
        <div class="auth-visual-copy">
          <span class="eyebrow">ZERO TRUST / 24×7</span>
          <h2>Defend every<br /><em>digital edge.</em></h2>
          <p>
            One secure control layer for identities, infrastructure and critical
            data.
          </p>
          <b>99.99%</b><small> Protected infrastructure</small>
        </div>
      </section>
      <section class="auth-card reveal">
        <div class="auth-intro">
          <span class="eyebrow">Secure access</span>
          <h1>Welcome back.</h1>
          <p>Choose your portal role and continue securely.</p>
        </div>
        <form id="loginForm" class="auth-form" novalidate>
          <div class="field">
            <label>PORTAL ROLE *</label
            ><select id="loginRole" required>
              <option value="">Select role</option>
              <option value="admin">Admin</option>
              <option value="client">Client</option></select
            ><small class="field-error"></small>
          </div>
          <div class="field">
            <label>EMAIL *</label
            ><input
              id="loginEmail"
              type="email"
              required
              placeholder="name@domain.com"
            /><small class="field-error"></small>
          </div>
          <div class="field">
            <label>PASSWORD *</label>
            <div class="password-wrap">
              <input
                id="loginPassword"
                type="password"
                required
                minlength="8"
                placeholder="Enter password"
              /><button
                type="button"
                class="password-toggle"
                aria-label="Show password"
              >
                <svg viewBox="0 0 24 24">
                  <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
                  <circle cx="12" cy="12" r="2.5" />
                </svg>
              </button>
            </div>
            <small class="field-error"></small>
          </div>
          <div class="auth-row">
            <label class="check-control"
              ><input type="checkbox" /> Remember me</label
            ><a href="404.html">Forgot password?</a>
          </div>
          <button class="btn btn-primary auth-submit" type="submit">
            Enter secure portal →
          </button>
          <!-- <div class="auth-message"></div> -->
        </form>
        <div class="auth-switch">
          Create account? <a href="signup.html">Sign up </a>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
